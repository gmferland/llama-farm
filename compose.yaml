  unsloth:
    image: unsloth/unsloth
    runtime: nvidia
    ports:
      - 8000:8000
    environment:
      HF_HOME: /hf_home
      LOG_LEVEL: DEBUG
    volumes:
      - hf_home:/hf_home
      - unsloth_work:/workspace/work
    deploy:
      resources:
        reservations:
          # devices:
          #   - driver: cdi
          #     device_ids:
          #       - nvidia.com/gpu=all
          #     capabilities: ["utility", "compute"]
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf_home:
  model_cache:
  unsloth_work:
