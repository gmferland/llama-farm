services:
  agent:
    build: ./agent
    ports:
      - "8000:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_REPO: ${GITHUB_REPO}
      LLM_BASE_URL: http://qwen:8080
      LLM_MODEL: unsloth/Qwen3.5-2B-GGUF
      AGENT_MAX_ITERATIONS: "20"
      AGENT_MAX_CONCURRENCY: "20"
    depends_on:
      - qwen

  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: "--temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.00"
    runtime: nvidia
    environment:
      LLAMA_ARG_MODEL: /models/unsloth/Qwen3.5-2B-UD-Q4_K_XL.gguf
      LLAMA_ARG_ALIAS: unsloth/Qwen3.5-2B-GGUF
      LLAMA_ARG_CTX_SIZE: 32768
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
    ports:
      - 8080:8080
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
