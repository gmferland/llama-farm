services:
  server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: |
      -hf unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.00
      --alias "unsloth/Qwen3.5-4B-GGUF"
    runtime: nvidia
    environment:
      LLAMA_CACHE: /mnt/models
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
    ports:
      - 8080:8080
    volumes:
      - model_cache:/mnt/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_cache:
