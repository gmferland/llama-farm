services:
  agent:
    build: ./agent/coding
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: http://server:8080
      LLM_MODEL: unsloth/Qwen3.5-4B-GGUF
      AGENT_MAX_ITERATIONS: "20"
      AGENT_MAX_CONCURRENCY: "20"
    secrets:
      - GITHUB_APP_ID
      - GITHUB_APP_PRIVATE_KEY
      - GITHUB_WEBHOOK_SECRET
    depends_on:
      - server

  server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: |
      -hf unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.00
      --alias "unsloth/Qwen3.5-4B-GGUF"
    runtime: nvidia
    environment:
      LLAMA_CACHE: /mnt/models
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
    ports:
      - 8080:8080
    volumes:
      - model_cache:/mnt/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

secrets:
  GITHUB_APP_ID:
    file: /secrets/GITHUB_APP_ID
  GITHUB_APP_PRIVATE_KEY:
    file: /secrets/GITHUB_APP_PRIVATE_KEY
  GITHUB_WEBHOOK_SECRET:
    file: /secrets/GITHUB_WEBHOOK_SECRET

volumes:
  model_cache:
