[project]
name = "llama-farm-agent-coding"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.15",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pygithub>=2.4.0",
    "PyJWT>=2.8",
    "cryptography",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.uv]
link-mode = "copy"
